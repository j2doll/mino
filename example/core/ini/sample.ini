; Global comment: demo INI for ini_parser
# Another global comment line

[Server]
; Server section leading comment
host='127.0.0.1' ; inline comment for host
path_raw='C:\\Program Files\\App\nLine2' # Raw string (escapes preserved: \n, \\)
path_literal="C:\\Program Files\\App\"Quote\"" ; Literal string (double-quoted, only \" escaped)
enabled=true
port=8080
timeout=15.5

[Database]
; Database section leading comment
db_name='test_db' ; inline comment for DB name
max_connections=100
use_ssl=false

[Misc]
; Examples of other forms
empty_value='' ; explicit empty string
unquoted_number=42 ; numeric parser will detect integer
float_unquoted=3.14159
flag_yes=true
path_with_tabs='Column1\tColumn2' ; raw escape for tab

; End of file
