name: C++ Comprehensive Analysis & Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # =========================================================================
    # 1. Ubuntu 환경 구성 및 패키지 설치
    # =========================================================================
    - name: Clean APT Sources and Install Tools (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        # 1. Force reliable Google DNS servers
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

        # 2. Clear previous apt lists and conflicting mirror configs
        sudo rm -rf /var/lib/apt/lists/*
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo rm -f /etc/apt/apt-mirrors.txt

        # 3. Detect current Ubuntu codename dynamically (e.g., resolute, noble)
        CODENAME=$(lsb_release -cs)
        echo "Detected Ubuntu codename: ${CODENAME}"

        sudo tee /etc/apt/sources.list << EOF
        deb http://archive.ubuntu.com/ubuntu/ ${CODENAME} main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu/ ${CODENAME}-updates main restricted universe multiverse
        deb http://archive.ubuntu.com/ubuntu/ ${CODENAME}-backports main restricted universe multiverse
        deb http://security.ubuntu.com/ubuntu/ ${CODENAME}-security main restricted universe multiverse
        EOF

        # 4. Update package lists and install required tools with retry logic
        SUCCESS=0
        for i in {1..3}; do
          if sudo apt-get update && sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            clang-tidy \
            cppcheck \
            libcurl4-openssl-dev \
            libssh2-1-dev \
            libssl-dev; then
            SUCCESS=1
            break
          else
            echo "Attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          fi
        done

        if [ $SUCCESS -ne 1 ]; then
          echo "Failed to install required packages after 3 attempts."
          exit 1
        fi

    # =========================================================================
    # 2. Windows vcpkg 바이너리 캐시 설정 (빌드 시간 단축)
    # =========================================================================
    - name: Cache vcpkg Archives (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ~/AppData/Local/vcpkg/archives
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    # =========================================================================
    # 3. CMake 프로젝트 구성 (Ubuntu & Windows 모두 Ninja 사용)
    # =========================================================================
    - name: Configure CMake with Ninja (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        cmake -B build \
          -S . \
          -G "Ninja" \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="~/mino" \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Configure CMake with Ninja & vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        :: Visual Studio (MSVC x64) 개발자 환경 변수 로드
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"

        :: GitHub Actions 기본 vcpkg 경로를 VCPKG_ROOT로 매핑
        set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"

        :: 로컬 Windows 빌드와 동일한 CMake 구성 실행 (vcpkg.json 자동 인식)
        cmake -B build ^
          -S . ^
          -G "Ninja" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_INSTALL_PREFIX="C:\opt\mino" ^
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake"

    # =========================================================================
    # 4. 정적 분석 (Cppcheck & Clang-Tidy - Ubuntu)
    # =========================================================================
    - name: Run Cppcheck (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        mkdir -p build/cppcheck_cache
        cppcheck --enable=warning,performance,portability --std=c++17 \
          -q \
          -j $(nproc) \
          --cppcheck-build-dir=build/cppcheck_cache \
          --max-configs=12 \
          --suppress=missingIncludeSystem \
          --suppress=normalCheckLevelMaxBranches \
          --suppress=checkersReport \
          --suppress='*:*third-party*' \
          -I ./mino/core/include \
          -I ./mino/external/include \
          -I ./mino/network/mino_network/include \
          -I ./mino/network/mino_network_curl/include \
          -I ./mino/network/mino_network_libssh2/include \
          -I ./mino/network/mino_network_openssl/include \
          -I ./mino/external/third-party \
          -I ./mino/network/mino_network_openssl/third-party \
          -i ./mino/external/third-party \
          -i ./mino/network/mino_network_openssl/third-party \
          -i ./.github \
          -i ./.vscode \
          -i ./.vs \
          -i ./.git \
          -i ./build \
          -i ./docs \
          -i ./example \
          -i ./tests \
          -i ./out \
          . 2>&1 | tee cppcheck_results.txt || true

    - name: Run Clang-Tidy (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        {
          echo "=== Clang-Tidy Analysis Result ==="
          find ./mino/core ./mino/network \
            -path "*/third-party*" -prune -o \
            -name "*.cpp" -print \
            | xargs -r clang-tidy --quiet -p build \
              --header-filter="^$(pwd)/mino/(core|network)/((?!third-party).)*$" \
              --checks="-modernize-use-trailing-return-type,-readability-magic-numbers,-readability-identifier-length,-readability-braces-around-statements,-modernize-avoid-c-arrays,-bugprone-easily-swappable-parameters" \
            2>&1 | grep -v -E "^(\[[0-9]+/[0-9]+\] Processing file|[0-9]+ warnings? generated\.|Suppressed [0-9]+ warnings)"
        } | tee clang_tidy_results.txt || true

    # =========================================================================
    # 5. 프로젝트 빌드 (Ubuntu & Windows)
    # =========================================================================
    - name: Build Project (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        set +e
        cmake --build build --config Release > build_results.txt 2>&1
        echo $? > build_exit_code.txt
        set -e

    - name: Build Project (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
        cmake --build build --config Release > build_results.txt 2>&1
        echo %ERRORLEVEL% > build_exit_code.txt
        exit /b 0

    # =========================================================================
    # 6. GitHub Actions Summary 결과 리포트 발행 (1MB 제한 방어 적용)
    # =========================================================================
    - name: Publish Results to GitHub Summary
      run: |
        MAX_BYTES=250000

        append_section() {
          local title="$1"
          local file="$2"

          echo "## ${title}" >> $GITHUB_STEP_SUMMARY
          if [ ! -f "$file" ] || [ ! -s "$file" ]; then
            echo "_출력된 이슈나 로그가 없습니다._" >> $GITHUB_STEP_SUMMARY
            return
          fi

          local size=$(wc -c < "$file")
          echo "<details><summary>로그 펼쳐보기 (${size} bytes)</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          head -c $MAX_BYTES "$file" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          if [ "$size" -gt "$MAX_BYTES" ]; then
            echo "> ⚠️ **로그가 너무 길어 상위 250KB까지만 표시되었습니다.** 전체 내용은 하단의 Artifacts(`analysis-and-build-logs-${{ matrix.os }}`)를 다운로드하여 확인하세요." >> $GITHUB_STEP_SUMMARY
          fi
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        }

        echo "# C++ Project Analysis & Build Summary (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY

        if [ "${RUNNER_OS}" == "Linux" ]; then
          append_section "1. Cppcheck Results" "cppcheck_results.txt"
          append_section "2. Clang-Tidy Results" "clang_tidy_results.txt"
        fi

        append_section "Build Results (${{ matrix.os }})" "build_results.txt"

    - name: Upload Full Logs as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: analysis-and-build-logs-${{ matrix.os }}
        path: |
          cppcheck_results.txt
          clang_tidy_results.txt
          build_results.txt
        if-no-files-found: ignore

    # =========================================================================
    # 7. 최종 품질 게이트 확인
    # =========================================================================
    - name: Final Quality Gate Check
      run: |
        BUILD_EXIT_CODE=$(tr -d ' \r\n' < build_exit_code.txt)

        if [ "$BUILD_EXIT_CODE" -ne 0 ] || grep -E -q "(error:|error C[0-9]+|fatal error|error LNK[0-9]+)" build_results.txt; then
          echo "Build errors detected on ${{ matrix.os }}!"
          cat build_results.txt
          exit 1
        fi

        echo "Quality check passed successfully on ${{ matrix.os }}!"
